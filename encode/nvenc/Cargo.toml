[package]
name        = "mv-encode"
version     = "0.1.0"
edition     = "2021"
description = "Multi-bitrate HLS encoder using h264_nvenc. Drives a per-rung ffmpeg subprocess and writes a top-level master playlist so the player can pick a rung as soon as its first segment lands."

[dependencies]
anyhow      = "1.0"
serde       = { version = "1.0", features = ["derive"] }
toml        = "0.8"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "mv-encode"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
